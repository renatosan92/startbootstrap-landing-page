<!-- ===== RECUADRO PROMOCIÓN BLACK FRIDAY =====
     Pegar justo antes de </body> en la página principal.
     Se coloca solo encima de la franja "Conoce el ecosistema · Elige tu siguiente paso"
     y desaparece solo cuando termina la promo (30 nov, 23:59). -->
<style>
.tep-bf{max-width:1120px;margin:56px auto;padding:0 20px}
.tep-bf a{display:grid;grid-template-columns:1fr auto;gap:28px 40px;align-items:center;text-decoration:none;color:#faf7ff;
  background:radial-gradient(70% 120% at 0% 0%,rgba(151,100,199,.28),transparent 60%),linear-gradient(125deg,#251535,#110b1b);
  border:2px solid #e6c87c;border-radius:20px;padding:44px 48px;box-shadow:0 20px 60px rgba(0,0,0,.45);transition:transform .15s,border-color .15s}
.tep-bf a:hover{transform:translateY(-2px);border-color:#f5dfaa}
.tep-bf .k{color:#d8c2f2;font-size:12px;font-weight:800;letter-spacing:.22em;margin-bottom:10px}
.tep-bf .t{font-weight:900;letter-spacing:.04em;font-size:clamp(30px,4.4vw,54px);line-height:1.02;color:#f5dfaa}
.tep-bf .s{color:#cfc5dc;font-size:17px;margin-top:12px}
.tep-bf .r{display:flex;flex-direction:column;align-items:stretch;gap:16px}
.tep-bf .lbl{color:#b9b1c6;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-align:center}
.tep-bf .cd{display:flex;gap:10px;justify-content:center}
.tep-bf .cd span{background:#09070e;border:1px solid #e6c87c;border-radius:12px;min-width:82px;padding:12px 6px;text-align:center}
.tep-bf .cd b{display:block;font-size:40px;font-weight:900;color:#f5dfaa;font-variant-numeric:tabular-nums;line-height:1}
.tep-bf .cd small{font-size:11px;color:#b9b1c6;text-transform:uppercase;letter-spacing:.1em}
.tep-bf .go{background:linear-gradient(110deg,#bd8c38,#f5dfaa,#c89d50);color:#1a1208;font-weight:900;font-size:17px;border-radius:10px;padding:16px 22px;text-align:center}
@media(max-width:820px){.tep-bf{margin:36px auto}.tep-bf a{grid-template-columns:1fr;padding:28px 20px;text-align:center}
  .tep-bf .cd span{min-width:64px;padding:10px 4px}.tep-bf .cd b{font-size:28px}.tep-bf .s{font-size:15px}}
</style>
<div class="tep-bf" id="tep-bf">
  <a href="/black-friday/" aria-label="Ver la promoción Black Friday">
    <div>
      <div class="k">SOLO DEL 6 AL 30 DE NOVIEMBRE</div>
      <div class="t">PROMOCIÓN<br>BLACK FRIDAY</div>
      <div class="s">ELITE 2x1, GOAT y upgrade a GOAT para alumnos, con descuento.</div>
    </div>
    <div class="r">
      <div class="lbl">Termina en</div>
      <div class="cd">
        <span><b data-bf="d">00</b><small>días</small></span>
        <span><b data-bf="h">00</b><small>horas</small></span>
        <span><b data-bf="m">00</b><small>min</small></span>
        <span><b data-bf="s">00</b><small>seg</small></span>
      </div>
      <span class="go">Ver promoción →</span>
    </div>
  </a>
</div>
<script>
(function(){
  var end=new Date('2026-11-30T23:59:59-05:00').getTime();
  var box=document.getElementById('tep-bf');
  function place(){
    var strip=document.querySelector('.section-divider');   // "Conoce el ecosistema · Elige tu siguiente paso"
    var hero=document.querySelector('.hero');
    if(strip)strip.before(box);else if(hero)hero.after(box);
  }
  function p(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=end-Date.now();
    if(d<=0){box.style.display='none';return;}
    box.querySelector('[data-bf="d"]').textContent=p(Math.floor(d/864e5));
    box.querySelector('[data-bf="h"]').textContent=p(Math.floor(d/36e5)%24);
    box.querySelector('[data-bf="m"]').textContent=p(Math.floor(d/6e4)%60);
    box.querySelector('[data-bf="s"]').textContent=p(Math.floor(d/1e3)%60);
    setTimeout(tick,1000);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',place);else place();
  tick();
})();
</script>
<!-- ===== FIN RECUADRO BLACK FRIDAY ===== -->
